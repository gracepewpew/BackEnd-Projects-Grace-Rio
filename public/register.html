<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MediCare Clinic UAS</title>
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <link href="assets/css/uas-custom.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100 g-4">
      <div class="col-lg-5">
        <div class="auth-hero">
          <a href="index.html" class="text-white text-decoration-none fw-bold"><i class="bi bi-arrow-left"></i> Kembali ke Home</a>
          <h1 class="mt-5 mb-3">Register Pasien</h1>
          <p class="lead">Akun pasien otomatis mendapat role <strong>pasien</strong> dan data rekam medis dasar.</p>
          <p class="mt-4">Admin tetap bisa mengelola data dokter, poli, appointment, pasien, dan feedback melalui dashboard.</p>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="auth-card p-4 p-md-5">
          <h2 class="fw-bold mb-2">Buat Akun Pasien</h2>
          <p class="text-muted mb-4">Isi data berikut untuk membuat akun baru.</p>
          <div id="authMessage" class="message-box mb-3"></div>
          <form id="registerForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" name="name" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Telepon</label>
                <input type="tel" name="phone" class="form-control" placeholder="08123456789" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Password</label>
                <div class="input-group">
                  <input type="password" name="password" id="registerPassword" class="form-control" minlength="8" required>
                  <button class="btn btn-outline-secondary" type="button" data-toggle-password="#registerPassword" aria-label="Lihat password"><i class="bi bi-eye"></i></button>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Re-enter Password</label>
                <div class="input-group">
                  <input type="password" name="confirmPassword" id="registerConfirmPassword" class="form-control" minlength="8" required>
                  <button class="btn btn-outline-secondary" type="button" data-toggle-password="#registerConfirmPassword" aria-label="Lihat ulang password"><i class="bi bi-eye"></i></button>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Tanggal Lahir</label>
                <input type="date" name="birthDate" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-select">
                  <option value="">Pilih</option>
                  <option value="Laki-laki">Laki-laki</option>
                  <option value="Perempuan">Perempuan</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Golongan Darah</label>
                <select name="bloodType" class="form-select">
                  <option value="">Pilih</option>
                  <option value="A">A</option>
                  <option value="B">B</option>
                  <option value="AB">AB</option>
                  <option value="O">O</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Alamat</label>
                <input type="text" name="address" class="form-control">
              </div>
              <div class="col-12">
                <button class="btn btn-primary w-100 py-2" type="submit">Register</button>
              </div>
            </div>
          </form>
          <p class="mt-4 mb-0 text-center">Sudah punya akun? <a href="login.html">Login</a></p>
        </div>
      </div>
    </div>
  </main>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app/api.js"></script>
  <script src="assets/js/app/auth.js"></script>
</body>
</html>
